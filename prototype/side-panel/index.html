<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Unclicked（余路）· Side Panel 原型</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="panel">
    <header class="panel-header">
      <h1 class="panel-title">The Unclicked</h1>
      <p class="panel-subtitle">余路 · 记住那些差一点选择的路径</p>
      <p class="panel-note">原型演示数据</p>
    </header>

    <section class="session" aria-labelledby="session-title">
      <h2 class="section-title" id="session-title">本次会话</h2>
      <!-- 主题与数字由 app.js 根据演示数据填入 -->
      <p class="session-topic">
        当前主题：<strong id="session-subject">—</strong>
      </p>
      <ul class="session-stats">
        <li>
          <span class="stat-value" id="chosen-count">0</span>
          <span class="stat-label">已选择</span>
        </li>
        <li>
          <span class="stat-value" id="missed-count">0</span>
          <span class="stat-label">考虑过未选择</span>
        </li>
      </ul>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">
      等待操作
    </p>

    <!-- 卡片全部由 app.js 中的演示数据生成，这里保持为空容器 -->
    <main class="card-list" id="card-list"></main>

    <p class="empty" id="empty-state" hidden>
      本次会话没有需要处理的内容。
    </p>

    <footer class="panel-footer">
      <p class="footer-note">数据保存在本地，可随时重置。</p>
      <button type="button" class="btn btn-quiet" id="reset-demo">
        重置演示数据
      </button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
