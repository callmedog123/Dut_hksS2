<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Unclicked（余路）</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="panel">
      <header class="panel-header">
        <h1 class="panel-title">The Unclicked</h1>
        <p class="panel-subtitle">余路 · 记住那些差一点选择的路径</p>
        <p class="panel-note">本地 Missed Path</p>
      </header>

      <section class="session contextual-session" aria-labelledby="reencounter-title">
        <h2 class="section-title" id="reencounter-title">情境化重逢</h2>
        <p class="session-topic" id="active-context-summary">
          等待 B 线提供当前搜索情境
        </p>
        <p
          class="status contextual-status"
          id="active-context-status"
          data-state="loading"
          role="status"
          aria-live="polite"
        >
          正在确认当前搜索情境…
        </p>
        <button
          type="button"
          class="btn btn-quiet contextual-retry"
          id="active-context-retry-button"
          hidden
        >
          重新确认情境
        </button>

        <p
          class="status contextual-status"
          id="reencounter-status"
          data-state="inactive"
          role="status"
          aria-live="polite"
          hidden
        ></p>
        <div
          class="card-list reencounter-list"
          id="reencounter-list"
          aria-label="情境化重逢列表"
          aria-busy="false"
        ></div>
        <p class="empty" id="reencounter-empty-state" hidden>
          当前情境下没有需要重逢的余路。
        </p>
        <button
          type="button"
          class="btn btn-quiet contextual-retry"
          id="reencounter-retry-button"
          hidden
        >
          重新查找
        </button>
      </section>

      <section class="session" aria-labelledby="summary-title">
        <h2 class="section-title" id="summary-title">考虑过但未选择</h2>
        <p class="session-topic">数据由扩展后台从本地 Repository 提供</p>
        <ul class="session-stats">
          <li>
            <span class="stat-value" id="missed-count">0</span>
            <span class="stat-label">当前记录</span>
          </li>
        </ul>
      </section>

      <p
        class="status"
        id="status"
        data-state="loading"
        role="status"
        aria-live="polite"
      >
        正在读取本地 Missed Path…
      </p>

      <main
        class="card-list"
        id="card-list"
        aria-label="Missed Path 列表"
        aria-busy="true"
      ></main>

      <p class="empty" id="empty-state" hidden>
        目前没有考虑过但未选择的候选。
      </p>

      <section class="session settings-control" aria-labelledby="settings-title">
        <h2 class="section-title" id="settings-title">采集控制</h2>
        <p
          class="status"
          id="settings-status"
          data-state="idle"
          role="status"
          aria-live="polite"
        >
          默认启用；暂停不会影响查看或删除已有记录。
        </p>
        <div class="settings-actions">
          <button type="button" class="btn btn-quiet" id="pause-collection-button">
            暂停采集
          </button>
          <button type="button" class="btn btn-quiet" id="resume-collection-button">
            恢复采集
          </button>
        </div>
      </section>

      <footer class="panel-footer">
        <p class="footer-note">
          所有记录仅保存在本地；删除会同时清理关联的重逢记录。
        </p>
        <button type="button" class="btn btn-quiet" id="retry-button" hidden>
          重新加载
        </button>
      </footer>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
